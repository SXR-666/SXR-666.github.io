<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#667eea;--primary-dark:#764ba2;--danger:#e74c3c;--success:#27ae60;--bg:#f0f2f5;--card:#fff;--text:#333;--text-light:#888;--border:#e8e8e8}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-card h1{text-align:center;font-size:22px;margin-bottom:6px;color:#333}
.login-card .sub{text-align:center;font-size:13px;color:#999;margin-bottom:28px}
.login-card .form-group{margin-bottom:18px}
.login-card label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:500}
.login-card input{width:100%;padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.login-card input:focus{border-color:var(--primary)}
.login-card .btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.login-card .btn-login:hover{opacity:.9}
.login-card .toggle{text-align:center;margin-top:16px;font-size:13px;color:#999}
.login-card .toggle a{color:var(--primary);cursor:pointer;font-weight:500}
.login-error{color:var(--danger);font-size:13px;text-align:center;margin-bottom:12px;display:none}

/* App layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;box-shadow:2px 0 12px rgba(0,0,0,.06);padding:20px 14px;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100}
.sidebar-brand{margin-bottom:24px;padding:0 8px}
.sidebar-brand .logo{font-size:18px;font-weight:700;color:#333}
.sidebar-brand .sub{font-size:12px;color:#999;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;cursor:pointer;transition:all .2s;color:#666;font-size:14px;font-weight:500;margin-bottom:4px}
.nav-item:hover{background:#f5f3ff;color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.25)}
.nav-item .icon{font-size:16px}
.sidebar-footer{padding-top:16px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f5f3ff;border-radius:8px;font-size:13px}
.user-badge{background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}
.btn-link{background:none;border:none;color:#999;cursor:pointer;font-size:13px;padding:4px}
.btn-link.danger{color:var(--danger)}

.main-content{flex:1;margin-left:220px;padding:24px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar-title{font-size:20px;font-weight:700;color:#333}

/* Views */
.view{display:none}
.view.show{display:block}
.view-container{max-width:900px;margin:0 auto}
.section-title{font-size:16px;font-weight:600;color:#333;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";display:inline-block;width:4px;height:16px;background:var(--primary);border-radius:2px}

/* Book grid */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.book-card{background:#fff;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06);border:2px solid transparent}
.book-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.15)}
.book-name{font-size:16px;font-weight:600;color:#333;margin-bottom:6px}
.book-desc{font-size:13px;color:#999;margin-bottom:12px}
.book-stats{display:flex;gap:12px}
.book-stats .stat{background:#f5f3ff;color:var(--primary);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}

/* Controls */
.controls{background:#fff;border-radius:12px;padding:24px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px}
.form-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.form-group{flex:1;min-width:140px}
.form-group label{display:block;font-size:13px;color:#888;margin-bottom:6px;font-weight:500}
.form-group select,.form-group input{width:100%;padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.form-group select:focus,.form-group input:focus{border-color:var(--primary)}
.mode-group{display:flex;gap:10px}
.mode-btn{flex:1;padding:9px 14px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;transition:all .2s;text-align:center;font-weight:500}
.mode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-row{display:flex;gap:12px;margin-top:8px}
.btn-primary{padding:12px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{padding:12px 20px;background:#fff;color:var(--primary);border:1.5px solid var(--primary);border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn-secondary:hover{background:#f5f3ff}

/* Table */
.table-area{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.table-toolbar .title{font-size:16px;font-weight:600}
.table-toolbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.tool-btn{padding:7px 14px;border:1.5px solid #ddd;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;transition:all .2s;color:#555}
.tool-btn:hover{border-color:var(--primary);color:var(--primary)}
.tool-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.tool-btn.success{border-color:var(--success);color:var(--success)}
.tool-btn.success:hover{background:var(--success);color:#fff}
.tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
table{width:100%;border-collapse:collapse}
thead{background:#f5f3ff}
th{padding:10px 8px;font-size:13px;font-weight:600;color:#555;text-align:center;border-bottom:2px solid var(--border)}
td{padding:10px 8px;font-size:13px;text-align:center;border-bottom:1px solid #f0f0f0;line-height:1.5}
tbody tr:hover{background:#faf9ff}
.idx{font-weight:600;color:#999;width:50px}
.unit-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.write-area{min-height:24px;border-bottom:1.5px dashed #ccc;padding:2px 6px;color:#333}
.write-area.empty{color:#ccc}
.answer-text{color:var(--success);font-weight:500}
.empty-state{text-align:center;padding:60px 20px;color:#bbb}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* Audio panel */
.audio-panel{background:#f0f4ff;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.audio-panel label{font-size:12px;color:#666;font-weight:500;white-space:nowrap}
.audio-panel select,.audio-panel input[type=range]{font-size:12px}
.audio-panel .sep{width:1px;height:24px;background:#d0d8e8}
.audio-status{font-size:12px;color:var(--primary);font-weight:500;min-width:80px}

/* Data table */
.data-table{width:100%;border-collapse:collapse;background:#fff}
.data-table th{background:#f5f3ff;padding:10px 12px;font-size:13px;font-weight:600;color:#555;text-align:left;border-bottom:2px solid var(--border)}
.data-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f0f0f0}
.data-table tr:hover{background:#faf9ff}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500}
.badge-blue{background:#e3f2fd;color:#1565c0}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-orange{background:#fff3e0;color:#e65100}
.badge-red{background:#fce4ec;color:#c62828}
.badge-gray{background:#f5f5f5;color:#999}
.row-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn-act{padding:4px 10px;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-weight:500;transition:opacity .2s}
.btn-act:hover{opacity:.85}
.btn-act.edit{background:#e3f2fd;color:#1565c0}
.btn-act.danger{background:#fce4ec;color:#c62828}
.btn-act.success{background:#e8f5e9;color:#2e7d32}

/* Filter bar */
.filter-bar{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.filter-bar select{padding:8px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:420px;max-width:90vw;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{font-size:24px;cursor:pointer;color:#999;line-height:1}
.modal-body{padding:20px 24px}
.modal-body .form-group{margin-bottom:14px}
.modal-body .form-group label{display:block;font-size:13px;color:#666;margin-bottom:5px;font-weight:500}
.modal-body .form-group input,.modal-body .form-group select,.modal-body .form-group textarea{width:100%;padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.modal-body .form-group input:focus,.modal-body .form-group select:focus{border-color:var(--primary)}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#333;color:#fff;padding:12px 28px;border-radius:8px;font-size:14px;z-index:2000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--danger)}
.toast.success{background:var(--success)}

/* Score display */
.score-display{font-weight:700;font-size:15px}
.score-high{color:var(--success)}
.score-mid{color:#f39c12}
.score-low{color:var(--danger)}
.score-none{color:#bbb;font-weight:400;font-size:13px}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:60px;padding:12px 6px}
  .sidebar-brand .logo,.sidebar-brand .sub,.nav-item span:not(.icon),.sidebar-footer .user-pill span:not(.user-badge){display:none}
  .sidebar-footer .user-pill{justify-content:center}
  .main-content{margin-left:60px;padding:16px}
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
}

/* Print */
@media print{
  .sidebar,.topbar,.controls,.table-toolbar,.audio-panel,.tool-btn,.btn-row,.section-title,.filter-bar,.nav-item,.data-table .row-actions,.toast,.modal-overlay,.user-pill,.sidebar-footer,.btn-speak{display:none!important}
  .main-content{margin:0;padding:0}
  .content-area{padding:0}
  .view.show{display:block!important;max-width:100%;padding:0}
  .view-container{max-width:100%}
  .table-area{box-shadow:none;display:block!important;padding:0;background:transparent}
  .table-container{max-width:100%}
  .col-table{font-size:10px;box-shadow:none;border-radius:0;width:100%;border-collapse:collapse}
  .col-table th,.col-table td{padding:3px 4px;border:1px solid #888}
  .col-table thead{background:#ddd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .col-table .idx{width:22px;text-align:center;color:#555}
  .col-table .ans-col{width:48%}
  .col-table .q-cell{text-align:left}
  .col-table .ans-cell{text-align:left}
  .write-line{display:inline-block;min-width:100%;min-height:14px;border-bottom:1px solid #888}
  .sheet-header{border-bottom:1px solid #333;padding-bottom:6px;margin-bottom:8px}
  .sheet-row{display:flex;align-items:flex-end;gap:6px;margin-bottom:4px}
  .sheet-name-row{font-size:12px}
  .sheet-label{white-space:nowrap}
  .sheet-label-gap{margin-left:14px}
  .sheet-line{display:inline-block;min-width:90px;border-bottom:1px solid #333;height:16px}
  .sheet-meta{justify-content:space-between;font-size:10px;color:#555;margin-top:2px}
  .sheet-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @page{margin:1cm}
}

/* 屏幕显示用：3列网格默写表样式 */
.sheet-header{border-bottom:1px dashed #d0d7e0;padding:14px 18px 12px;background:#fafbfc;border-radius:10px 10px 0 0;display:flex;flex-direction:column;gap:8px}
.sheet-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet-name-row{font-size:15px}
.sheet-label{color:#555;font-weight:600;white-space:nowrap}
.sheet-label-gap{margin-left:14px}
.sheet-line{display:inline-block;flex:1;min-width:120px;border-bottom:1.5px solid #5b6b80;height:22px}
.sheet-meta{justify-content:space-between;font-size:13px;color:#6b7280;padding-top:4px;border-top:1px dashed #e0e6ec}
.sheet-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:16px 18px 18px;background:#fff}
.sheet-cols.cols-2{grid-template-columns:1fr 1fr}
.sheet-cols.cols-3{grid-template-columns:1fr 1fr 1fr}
.sheet-cols.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
@media print{
  .sheet-cols{display:grid;gap:6px;padding:0;background:transparent}
  .sheet-cols.cols-2{grid-template-columns:1fr 1fr}
  .sheet-cols.cols-3{grid-template-columns:1fr 1fr 1fr}
  .sheet-cols.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
  .col-table .ans-col{width:42%}
  .col-table.cols-2 .ans-col{width:55%}
  .col-table.cols-4 .ans-col{width:38%}
}
.col-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.col-table thead th{background:#eef2f7;color:#334155;font-weight:600;padding:8px 6px;border:1px solid #cbd5e1;text-align:center;font-size:12px}
.col-table tbody td{border:1px solid #e2e8f0;padding:6px 6px;vertical-align:middle}
.col-table .idx{width:28px;text-align:center;color:#64748b;font-weight:500;background:#f8fafc}
.col-table .ans-col{background:#f1f5f9;color:#475569}
.col-table .q-cell{text-align:left}
.col-table .ans-cell{text-align:left;background:#fafbfc}
.write-line{display:inline-block;min-width:100%;min-height:18px;border-bottom:1.5px solid #94a3b8}
/* 发音按钮：屏幕可点，打印时隐藏 */
.btn-speak{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:none;background:#eef2ff;color:#4f46e5;border-radius:5px;cursor:pointer;font-size:12px;line-height:1;vertical-align:middle;transition:background .15s,transform .1s}
.btn-speak:hover{background:#c7d2fe;transform:scale(1.12)}
.btn-speak:active{transform:scale(0.95)}
.col-table .q-cell{text-align:left;white-space:normal}
.col-table .q-cell .btn-speak{margin-right:4px}

</style>

const DB = {
  getKey(k) { return 'dict_' + k; },
  get(k, def) { try { const v = localStorage.getItem(this.getKey(k)); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem(this.getKey(k), JSON.stringify(v)); },
  getUsers() { return this.get('users', null); },
  setUsers(u) { this.set('users', u); },
  getBooks() { return this.get('books', []); },
  setBooks(b) { this.set('books', b); },
  getWords(bookId) { return this.get('words_' + bookId, []); },
  setWords(bookId, w) { this.set('words_' + bookId, w); },
  getClasses() { return this.get('classes', []); },
  setClasses(c) { this.set('classes', c); },
  getStudents() { return this.get('students', []); },
  setStudents(s) { this.set('students', s); },
  getRecords() { return this.get('records', []); },
  setRecords(r) { this.set('records', r); }
};

    books = rebuilt.concat(others);
    DB.setBooks(books);

// ===== Auth =====
function getSession() { return JSON.parse(sessionStorage.getItem('dict_session') || 'null'); }
function setSession(u) { sessionStorage.setItem('dict_session', JSON.stringify(u)); }
function clearSession() { sessionStorage.removeItem('dict_session'); }

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const users = DB.getUsers();
  const user = users.find(x => x.username === u && x.password === p);
  const err = document.getElementById('loginError');
  if (!user) { err.textContent = '用户名或密码错误'; err.style.display = 'block'; return; }
  currentUser = { id: user.id, username: user.username, isAdmin: user.isAdmin };
  setSession(currentUser);
  enterApp();
}

let regMode = false;
function toggleRegister() {
  regMode = !regMode;
  document.getElementById('regExtra').style.display = regMode ? 'block' : 'none';
  document.getElementById('loginError').style.display = 'none';
}
function doRegister() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const p2 = document.getElementById('loginPass2').value;
  const err = document.getElementById('loginError');
  if (!u || !p) { err.textContent = '用户名和密码不能为空'; err.style.display = 'block'; return; }
  if (p !== p2) { err.textContent = '两次密码不一致'; err.style.display = 'block'; return; }
  if (u.length < 2) { err.textContent = '用户名至少2个字符'; err.style.display = 'block'; return; }
  const users = DB.getUsers();
  if (users.find(x => x.username === u)) { err.textContent = '用户名已存在'; err.style.display = 'block'; return; }
  users.push({ id: 'u' + Date.now(), username: u, password: p, isAdmin: false });
  DB.setUsers(users);
  toast('注册成功，请登录', 'success');
  toggleRegister();
}

function doLogout() {
  clearSession();
  currentUser = null;
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ===== 数据导入/导出（跨设备同步） =====
function exportData() {
  const data = { version: 2, exportTime: new Date().toISOString() };
  data.users = DB.getUsers() || [];
  data.books = DB.getBooks();
  data.classes = DB.getClasses();
  data.students = DB.getStudents();
  data.records = DB.getRecords();
  data.bookWords = {};
  data.books.forEach(b => { data.bookWords[b.id] = DB.getWords(b.id); });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '默写系统数据_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('数据已导出，可发送给其他设备导入', 'success');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.version) { toast('文件格式不正确', 'error'); return; }
        if (!confirm('导入将覆盖当前所有数据（包括账号、班级、学生、记录），确定继续？')) return;
        if (data.users) DB.setUsers(data.users);
        if (data.books) DB.setBooks(data.books);
        if (data.classes) DB.setClasses(data.classes);
        if (data.students) DB.setStudents(data.students);
        if (data.records) DB.setRecords(data.records);
        if (data.bookWords) { for (const bid in data.bookWords) DB.setWords(bid, data.bookWords[bid]); }
        loadAllData();
        toast('数据导入成功！', 'success');
      } catch(err) { toast('导入失败：' + err.message, 'error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

  document.querySelectorAll('.view').forEach(v => v.classList.remove('show'));
  document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('show');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));

function renderBookGrid() {
  const grid = document.getElementById('bookGrid');
  if (allBooks.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>暂无词书' + (currentUser.isAdmin ? '，请点击右上角「导入词书」' : '') + '</p></div>';
    return;
  }
  grid.innerHTML = allBooks.map(b => {
    const adminBtn = currentUser.isAdmin ? '<div style="margin-top:8px;text-align:right"><button class="btn-act danger" onclick="event.stopPropagation();deleteBook(\''+b.id+'\',\''+escapeHtml(b.name)+'\')">🗑️ 删除</button></div>' : '';
    return '<div class="book-card" onclick="selectBookForPractice(\''+b.id+'\')"><div class="book-name">'+escapeHtml(b.name)+'</div><div class="book-desc">'+escapeHtml(b.description||'点击开始默写练习')+'</div><div class="book-stats"><span class="stat">'+b.totalWords+' 词</span><span class="stat">'+b.unitCount+' 单元</span></div>'+adminBtn+'</div>';
  }).join('');
}

function renderBookSelect() {
  const sel = document.getElementById('bookSelect');
  sel.innerHTML = '<option value="">请选择词书</option>' + allBooks.map(b => '<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('');
}

function selectBookForPractice(bookId) {
  document.getElementById('bookSelect').value = bookId;
  onBookChange();
  showNav('practice');
}

function onBookChange() {
  const bookId = document.getElementById('bookSelect').value;
  if (!bookId) { allWords = []; allUnits = []; return; }
  const book = allBooks.find(b => b.id === bookId);
  if (!book) return;
  currentBook = book;
  allWords = DB.getWords(bookId);
  allUnits = [...new Set(allWords.map(w => w.u))].sort((a,b) => a-b);
  const sel1 = document.getElementById('unitStart');
  const sel2 = document.getElementById('unitEnd');
  sel1.innerHTML = allUnits.map(u => '<option value="'+u+'">第'+u+'单元</option>').join('');
  sel2.innerHTML = allUnits.map(u => '<option value="'+u+'">第'+u+'单元</option>').join('');
  if (allUnits.length > 0) { sel1.value = allUnits[0]; sel2.value = allUnits[Math.min(4, allUnits.length-1)]; }
}

function openImportModal() {
  if (!currentUser.isAdmin) { toast('需要管理员权限', 'error'); return; }
  document.getElementById('importBookName').value = '';

  document.getElementById('importBookFile').value = '';
  openModal('importBookModal');
}

function doImportBook() {
  const name = document.getElementById('importBookName').value.trim();
  const desc = document.getElementById('importBookDesc').value.trim();
  const fileInput = document.getElementById('importBookFile');
  if (!name) { toast('请填写词书名称', 'error'); return; }
  if (!fileInput.files[0]) { toast('请选择Excel文件', 'error'); return; }
  const btn = document.getElementById('importBookSubmit');
  btn.disabled = true; btn.textContent = '导入中...';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
      const words = [];
      for (const row of rows) {
        if (row[0] != null && row[1] != null) {
          words.push({ u: parseInt(row[0]) || 0, e: String(row[1]).trim(), c: String(row[2] || '').trim() });
        }
      }
      if (words.length === 0) { toast('文件中没有有效数据', 'error'); btn.disabled = false; btn.textContent = '导入'; return; }
      const bookId = 'book_' + Date.now();
      DB.setWords(bookId, words);
      const units = [...new Set(words.map(w => w.u))].sort((a,b) => a-b);
      const book = { id: bookId, name, description: desc, createdAt: new Date().toISOString(), totalWords: words.length, unitCount: units.length };
      allBooks.push(book);
      DB.setBooks(allBooks);
      renderBookGrid(); renderBookSelect();
      toast('词书导入成功！共 ' + words.length + ' 词', 'success');
      closeModal('importBookModal');
    } catch(err) { toast('文件解析失败: ' + err.message, 'error'); }
    btn.disabled = false; btn.textContent = '导入';
  };
  reader.readAsArrayBuffer(fileInput.files[0]);
}

function deleteBook(bookId, bookName) {
  if (!currentUser.isAdmin) return;

  allBooks = allBooks.filter(b => b.id !== bookId);
  DB.setBooks(allBooks);
  localStorage.removeItem(DB.getKey('words_' + bookId));
  renderBookGrid(); renderBookSelect();
  toast('词书已删除', 'success');
}

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

function onColCountChange() {
  // 如果已生成默写表，则实时按新列数重排
  if (currentWords && currentWords.length > 0 && document.getElementById('tableArea').style.display === 'block') {
    renderTable();
  }
}

function generate() {
  const classId = document.getElementById('classSelect').value;
  const studentId = document.getElementById('studentSelect').value;
  const bookId = document.getElementById('bookSelect').value;
  if (!bookId) { toast('请先选择词书', 'error'); return; }
  let s = parseInt(document.getElementById('unitStart').value);
  let e = parseInt(document.getElementById('unitEnd').value);
  if (s > e) { [s, e] = [e, s]; }
  const count = parseInt(document.getElementById('count').value);
  const pool = allWords.filter(w => w.u >= s && w.u <= e);
  if (pool.length === 0) { toast('该范围内没有单词', 'error'); return; }
  const n = Math.min(count, pool.length);
  if (count > pool.length) toast('范围内仅 ' + pool.length + ' 词，已全部抽取', 'error');
  currentWords = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
  currentClass = classId ? allClasses.find(c => c.id === classId) : null;
  currentStudent = studentId ? allStudents.find(s => s.id === studentId) : null;
  showAnswer = false;
  document.getElementById('answerBtn').textContent = '显示答案';
  document.getElementById('tableArea').style.display = 'block';
  document.getElementById('audioPanel').style.display = 'flex';
  stopPlay();
  renderTable();
}

function renderTable() {
  const s = document.getElementById('unitStart').value;
  const e = document.getElementById('unitEnd').value;
  const modeText = currentMode === 'cn2en' ? '看中文写英文' : '看英文写中文';
  document.getElementById('tableTitle').textContent = (currentStudent ? currentStudent.name + ' · ' : '') + (currentBook ? currentBook.name : '') + ' · 第' + s + '-' + e + '单元 · ' + currentWords.length + '词 · ' + modeText;

  // 拆分单词到N列（按数量尽量均分）
  const N = currentWords.length;
  const colCount = parseInt(document.getElementById('colCount') ? document.getElementById('colCount').value : 3) || 3;
  const perCol = Math.ceil(N / colCount);
  const cols = [];
  for (let c = 0; c < colCount; c++) cols.push(currentWords.slice(c * perCol, (c + 1) * perCol));

  // 试卷顶部信息（学生姓名、班级、日期、课程范围、模式）
  const today = new Date();
  const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const className = currentClass ? currentClass.name : '';
  const bookName = currentBook ? currentBook.name : '';

  let html = '<div class="sheet-header">';
  html += '<div class="sheet-row sheet-name-row">';
  html += '<span class="sheet-label">姓名：</span><span class="sheet-line"></span>';
  if (className) html += '<span class="sheet-label sheet-label-gap">班级：</span><span class="sheet-line" style="min-width:110px"></span>';
  html += '<span class="sheet-label sheet-label-gap">日期：</span><span class="sheet-line" style="min-width:90px">' + dateStr + '</span>';
  html += '</div>';
  html += '<div class="sheet-row sheet-meta"><span>课程：' + escapeHtml(bookName) + ' · 第' + s + '-' + e + '单元</span><span>单词数：' + N + '</span><span>模式：' + modeText + '</span></div>';
  html += '</div>';

  // N列默写表（每列：序号 + 题目[含发音按钮] + 答题区）
  // 听力模式：题目列只保留🔊按钮，答题区让学生听音默写
  const listenLabel = listeningMode ? '听音写词' : (currentMode === 'cn2en' ? '中文' : '英文');
  const answerLabel = listeningMode ? '默写区' : (currentMode === 'cn2en' ? '英文' : '中文');
  html += '<div class="sheet-cols cols-' + colCount + '">';
  cols.forEach((colWords, ci) => {
    if (colWords.length === 0) return;
    html += '<table class="col-table"><colgroup><col style="width:26px"><col></col><col></col></colgroup><thead><tr><th class="idx">#</th><th>' + listenLabel + '</th><th class="ans-col">' + answerLabel + '</th></tr></thead><tbody>';
    colWords.forEach((w, i) => {
      const idx = ci * perCol + i + 1;
      // 发音按钮（打印时由CSS隐藏）
      const speakBtn = '<button class="btn-speak" onclick="speakWord(\'' + escapeHtml(w.e) + '\')" title="点击报读音">🔊</button>';
      // 题目文字：听力模式下不显示，仅留发音按钮
      const leftText = listeningMode ? '' : (currentMode === 'cn2en' ? escapeHtml(w.c) : escapeHtml(w.e));
      const left = speakBtn + (leftText ? ' ' + leftText : '');
      // 答题区：显示答案 / 听力默写线 / 普通默写线
      let right;
      if (showAnswer) {
        right = listeningMode ? (escapeHtml(w.e) + ' / ' + escapeHtml(w.c)) : (currentMode === 'cn2en' ? escapeHtml(w.e) : escapeHtml(w.c));
      } else {
        right = '<span class="write-line">&nbsp;</span>';
      }
      html += '<tr><td class="idx">' + idx + '</td><td class="q-cell">' + left + '</td><td class="ans-cell">' + right + '</td></tr>';
    });
    html += '</tbody></table>';
  });
  html += '</div>';
  document.getElementById('tableContainer').innerHTML = html;
}

function unitColor(u) {
  const colors = [
    {bg:'#e3f2fd',fg:'#1565c0'},{bg:'#e8f5e9',fg:'#2e7d32'},{bg:'#fff3e0',fg:'#e65100'},
    {bg:'#fce4ec',fg:'#c62828'},{bg:'#f3e5f5',fg:'#6a1b9a'},{bg:'#e0f7fa',fg:'#00838f'},
    {bg:'#e8eaf6',fg:'#283593'},{bg:'#fff8e1',fg:'#f57f17'},{bg:'#e1f5fe',fg:'#01579b'},
    {bg:'#ede7f6',fg:'#4527a0'},{bg:'#e0f2f1',fg:'#004d40'},{bg:'#fbe9e7',fg:'#bf360c'}
  ];
  return colors[(u-1) % colors.length];
}

function toggleAnswer() {
  showAnswer = !showAnswer;
  document.getElementById('answerBtn').textContent = showAnswer ? '隐藏答案' : '显示答案';
  renderTable();
}

function clearTable() {

  document.getElementById('tableTitle').textContent = '默写表';
  document.getElementById('tableArea').style.display = 'none';
}

// ===== Records =====
function renderRecords() {
  const container = document.getElementById('recordTable');
  const filterClass = document.getElementById('recordFilterClass').value;
  const filterStudent = document.getElementById('recordFilterStudent').value;
  let records = DB.getRecords();
  // Update student filter options
  const stuFilter = document.getElementById('recordFilterStudent');
  const currentStuFilter = stuFilter.value;
  const studentsInClass = filterClass ? allStudents.filter(s => s.classId === filterClass) : allStudents;
  stuFilter.innerHTML = '<option value="">全部学生</option>' + studentsInClass.map(s => '<option value="'+s.id+'">'+escapeHtml(s.name)+'</option>').join('');
  stuFilter.value = currentStuFilter;
  if (filterClass) records = records.filter(r => r.classId === filterClass);
  if (filterStudent) records = records.filter(r => r.studentId === filterStudent);
  records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (records.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>暂无默写记录</p></div>';
    return;
  }
  container.innerHTML = '<table class="data-table"><thead><tr><th>班级</th><th>学生</th><th>分数</th><th>时间</th><th>默写类型</th><th>操作</th></tr></thead><tbody>' +
    records.map(r => {
      const scoreText = r.score !== null && r.score !== undefined ? '<span class="score-display '+(r.score>=80?'score-high':r.score>=60?'score-mid':'score-low')+'">'+r.score+'</span>' : '<span class="score-none">未打分</span>';
      const typeText = r.mode === 'cn2en' ? '看中写英' : '看英写中';
      const adminBtn = currentUser.isAdmin ? '<button class="btn-act success" onclick="scoreRecord(\''+r.id+'\')">📝 打分</button><button class="btn-act danger" onclick="deleteRecord(\''+r.id+'\')">🗑️ 删除</button>' : '';
      return '<tr><td>'+escapeHtml(r.className)+'</td><td>'+escapeHtml(r.studentName)+'</td><td>'+scoreText+'</td><td>'+formatTime(r.createdAt)+'</td><td>'+typeText+' · '+escapeHtml(r.bookName)+' · U'+r.unitStart+'-'+r.unitEnd+'</td><td class="row-actions"><button class="btn-act edit" onclick="showRecordDetail(\''+r.id+'\')">👁️ 详情</button>'+adminBtn+'</td></tr>';
    }).join('') + '</tbody></table>';
}

function showRecordDetail(id) {
  const records = DB.getRecords();
  const r = records.find(x => x.id === id);
  if (!r) return;
  const body = document.getElementById('detailModalBody');
  let html = '<div style="margin-bottom:16px;padding:12px;background:#f5f3ff;border-radius:8px;font-size:13px;line-height:1.8">' +
    '<b>学生：</b>' + escapeHtml(r.studentName) + ' | <b>班级：</b>' + escapeHtml(r.className) + '<br>' +
    '<b>词书：</b>' + escapeHtml(r.bookName) + ' | <b>范围：</b>第' + r.unitStart + '-' + r.unitEnd + '单元 | <b>词数：</b>' + r.wordCount + '<br>' +
    '<b>类型：</b>' + (r.mode === 'cn2en' ? '看中写英' : '看英写中') + ' | <b>分数：</b>' + (r.score !== null ? r.score + '分' : '未打分') + ' | <b>时间：</b>' + formatTime(r.createdAt) +
    '</div>';
  html += '<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="background:#f5f3ff"><th style="padding:6px;border:1px solid #e8e8e8">#</th><th style="padding:6px;border:1px solid #e8e8e8">单元</th><th style="padding:6px;border:1px solid #e8e8e8">英文</th><th style="padding:6px;border:1px solid #e8e8e8">中文</th></tr></thead><tbody>';
  (r.words || []).forEach((w, i) => {
    html += '<tr><td style="padding:6px;border:1px solid #e8e8e8;text-align:center">'+(i+1)+'</td><td style="padding:6px;border:1px solid #e8e8e8;text-align:center">U'+w.u+'</td><td style="padding:6px;border:1px solid #e8e8e8;font-weight:600">'+escapeHtml(w.e)+'</td><td style="padding:6px;border:1px solid #e8e8e8">'+escapeHtml(w.c)+'</td></tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  openModal('detailModal');
}

function scoreRecord(id) {
  const records = DB.getRecords();
  const r = records.find(x => x.id === id);
  if (!r) return;
  const body = document.getElementById('scoreModalBody');
  body.innerHTML = '<div class="form-group"><label>班级</label><input type="text" value="'+escapeHtml(r.className)+'" readonly></div>' +
    '<div class="form-group"><label>学生</label><input type="text" value="'+escapeHtml(r.studentName)+'" readonly></div>' +
    '<div class="form-group"><label>默写范围</label><input type="text" value="'+escapeHtml(r.bookName)+' · 第'+r.unitStart+'-'+r.unitEnd+'单元 · '+r.wordCount+'词" readonly></div>' +
    '<div class="form-group"><label>分数</label><input type="number" id="scoreInput" min="0" max="100" value="'+(r.score||'')+'" placeholder="0-100" style="font-size:18px;font-weight:600"></div>';
  pendingScore = id;
  openModal('scoreModal');
  setTimeout(() => document.getElementById('scoreInput').focus(), 100);
}

function saveRecord() {
  const score = document.getElementById('scoreInput').value;
  const records = DB.getRecords();
  if (pendingScore) {
    const r = records.find(x => x.id === pendingScore);
    if (r) r.score = score !== '' ? parseInt(score) : null;
  } else {
    records.push({
      id: 'r' + Date.now(),
      classId: currentClass ? currentClass.id : '',
      className: currentClass ? currentClass.name : '',
      studentId: currentStudent ? currentStudent.id : '',
      studentName: currentStudent ? currentStudent.name : '',
      bookId: currentBook ? currentBook.id : '',
      bookName: currentBook ? currentBook.name : '',
      unitStart: parseInt(document.getElementById('unitStart').value),
      unitEnd: parseInt(document.getElementById('unitEnd').value),
      wordCount: currentWords.length,
      mode: currentMode,
      words: currentWords.map(w => ({ u: w.u, e: w.e, c: w.c })),
      score: score !== '' ? parseInt(score) : null,
      createdAt: new Date().toISOString()
    });
  }
  DB.setRecords(records);
  closeModal('scoreModal');
  pendingScore = null;
  toast('保存成功', 'success');
  renderRecords();
}

function deleteRecord(id) {
  if (!currentUser.isAdmin) return;
  if (!confirm('确定删除这条默写记录？')) return;
  let records = DB.getRecords();
  records = records.filter(r => r.id !== id);
  DB.setRecords(records);
  renderRecords();
  toast('记录已删除', 'success');
}

// ===== Audio (Web Speech API) =====
function speakWord(word) {
  if (!('speechSynthesis' in window)) { toast('浏览器不支持语音合成', 'error'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = parseFloat(document.getElementById('speechRate').value);
  speechSynthesis.speak(u);
}

function playAllWords() {
  if (currentWords.length === 0) return;
  if (!('speechSynthesis' in window)) { toast('浏览器不支持语音合成', 'error'); return; }
  isPlaying = true;
  listeningMode = true;
  document.getElementById('listeningBtn').textContent = '听力模式：开';
  document.getElementById('listeningBtn').classList.add('active');
  document.getElementById('playAllBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'inline-block';
  renderTable();
  const rate = parseFloat(document.getElementById('speechRate').value);
  const gap = parseInt(document.getElementById('speechGap').value);
  const repeat = parseInt(document.getElementById('speechRepeat').value);
  let idx = 0;
  function next() {
    if (!isPlaying || idx >= currentWords.length) { stopPlay(); return; }
    const w = currentWords[idx];
    document.getElementById('audioStatus').textContent = '播放中: ' + (idx+1) + '/' + currentWords.length;
    let count = 0;
    function speakOnce() {
      if (!isPlaying) return;
      const u = new SpeechSynthesisUtterance(w.e);
      u.lang = 'en-US'; u.rate = rate;
      u.onend = () => {
        count++;
        if (count < repeat && isPlaying) { playTimer = setTimeout(speakOnce, 500); }
        else if (isPlaying) { idx++; playTimer = setTimeout(next, gap); }
      };
      speechSynthesis.speak(u);
    }
    speakOnce();
  }
  next();
}

function stopPlay() {
  isPlaying = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('playAllBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('audioStatus').textContent = '';
}

function toggleListeningMode() {
  listeningMode = !listeningMode;
  const btn = document.getElementById('listeningBtn');
  btn.textContent = '听力模式：' + (listeningMode ? '开' : '关');
  btn.classList.toggle('active', listeningMode);
  renderTable();
}

// ===== Utilities =====
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function formatTime(iso) { const d = new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + (type||'') + ' show'; setTimeout(() => t.classList.remove('show'), 2500); }
